<!DOCTYPE html>
<html>
<head><title>Theme Songs</title></head>
<body>
<div data-role="page" class="page type-interior pluginConfigurationPage tbsConfigurationPage" data-require="emby-input,emby-button">
  <div data-role="content"><div class="content-primary">
    <form id="themeSongsSettingsForm">
      <h2>Theme Songs</h2>
      <div class="verticalSection">
        <label class="inputLabel" for="themeSongUrlTemplate">Theme song URL template</label>
        <input is="emby-input" type="text" id="themeSongUrlTemplate" />
        <div class="fieldDescription">Placeholders: {tvdbId}, {imdbId}, {tmdbId}</div>
      </div>
      <div class="verticalSection" style="margin-top: 2em">
        <h3>Libraries to scan</h3>
        <p class="fieldDescription">Only selected libraries are scanned. If none are checked, nothing is downloaded.</p>
        <div id="themeSongLibraries">Loading libraries…</div>
      </div>
      <button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button>
      <button is="emby-button" type="button" class="raised block" id="themeSongsDownload"><span>Download Theme Songs</span></button>
    </form>
  </div></div>
<script type="text/javascript">
(function () {
    const page = document.querySelector('.tbsConfigurationPage');
    const pluginId = 'afe1de9c-63e4-4692-8d8c-7c964df19eb2';
    const form = page.querySelector('#themeSongsSettingsForm');
    const templateInput = page.querySelector('#themeSongUrlTemplate');
    const librariesContainer = page.querySelector('#themeSongLibraries');
    let librariesLoaded = false;

    async function loadSettings() {
        try {
            const [config, folders] = await Promise.all([
                ApiClient.getPluginConfiguration(pluginId),
                ApiClient.getJSON(ApiClient.getUrl('Library/VirtualFolders'))
            ]);
            templateInput.value = config.ThemeSongUrlTemplate || '';
            const selected = new Set(config.SelectedLibraryIds || []);
            librariesContainer.replaceChildren();
            const seriesLibraries = folders.filter(folder =>
                folder.CollectionType === 'tvshows' && folder.ItemId);
            if (!seriesLibraries.length) {
                librariesContainer.textContent = 'No TV series libraries were returned by Jellyfin.';
                librariesLoaded = false;
                return;
            }
            seriesLibraries.forEach(folder => {
                const label = document.createElement('label');
                label.style.display = 'block';
                label.style.margin = '0.8em 0';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'themeSongLibrary';
                checkbox.value = folder.ItemId;
                checkbox.checked = selected.has(folder.ItemId);
                label.append(checkbox, document.createTextNode(' ' + folder.Name));
                librariesContainer.appendChild(label);
            });
            librariesLoaded = true;
        } catch (err) {
            librariesLoaded = false;
            console.error('Theme Songs configuration load failed', err);
            librariesContainer.textContent = 'Unable to load libraries.';
        }
    }

    form.addEventListener('submit', async event => {
        event.preventDefault();
        if (!librariesLoaded) {
            Dashboard.alert('Cannot save until the library list loads successfully.');
            return;
        }
        try {
            const config = await ApiClient.getPluginConfiguration(pluginId);
            config.ThemeSongUrlTemplate = templateInput.value.trim();
            config.SelectedLibraryIds = Array.from(page.querySelectorAll('.themeSongLibrary:checked'), input => input.value);
            const result = await ApiClient.updatePluginConfiguration(pluginId, config);
            Dashboard.processPluginConfigurationUpdateResult(result);
        } catch (err) {
            console.error(err);
            Dashboard.alert('Unable to save Theme Songs configuration.');
        }
    });

    page.querySelector('#themeSongsDownload').addEventListener('click', async () => {
        try {
            await ApiClient.fetch({ url: ApiClient.getUrl('ThemeSongs/DownloadTVShows'), type: 'POST' });
            Dashboard.alert('Theme song scan completed. Check Jellyfin logs for details.');
        } catch (err) {
            console.error(err);
            Dashboard.alert('Theme song download failed. Check Jellyfin logs.');
        }
    });

    page.addEventListener('pageshow', loadSettings);
    loadSettings();
})();
</script>
</div>
</body>
</html>
